<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MES-bridge Magazijn</title>
<style>
:root{--bg:#C9CCCF;--pnl:#E6E8EA;--kop:#23272B;--tekst:#1A1D20;--tekst2:#4A4F55;--lijn:#B9BEC3;--accent:#2A71B8;--ok:#3B6D11;--err:#C62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:15px Arial,Helvetica,sans-serif}
header{background:var(--kop);color:#EEF0F2;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:1px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid #545B62;background:#33393F;padding:4px 10px;border-radius:3px;font-size:13px;font-weight:700}
.led{width:10px;height:10px;border-radius:50%;background:#80868C}
main{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
.pnl{background:var(--pnl);border:1px solid #868C93;border-radius:4px;overflow:hidden}
.pnl h2{margin:0;font-size:14px;letter-spacing:1px;color:#fff;background:#4E565F;border-left:4px solid var(--accent);padding:7px 10px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.6px;color:#3A3F44;background:#D2D5D8;padding:7px 10px;border-bottom:1px solid #8E949A;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--lijn);white-space:nowrap}
.st{display:inline-block;padding:2px 8px;border-radius:2px;font-size:12px;font-weight:700;color:#fff}
.bar{width:70px;height:9px;background:#fff;border:1px solid #8E949A;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--accent)}
form{padding:12px;display:grid;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--tekst2);font-weight:700}
input,select{font:inherit;padding:7px 8px;border:1px solid #8E949A;border-radius:3px;background:#fff;min-width:0}
button{font:inherit;font-weight:700;padding:9px 12px;border:1px solid #123F6C;border-radius:3px;background:var(--accent);color:#fff;cursor:pointer}
button.klein{padding:3px 8px;font-size:12px;background:#E9EBED;color:var(--tekst);border-color:#8E949A}
#melding{min-height:20px;font-weight:700}
.leeg{padding:14px;color:var(--tekst2)}
</style>
</head>
<body>
<header>
  <h1>MES-BRIDGE · MAGAZIJN</h1>
  <span style="flex:1"></span>
  <span class="chip"><span class="led" id="ledPlc"></span><span id="txtPlc">PLC …</span></span>
  <span class="chip" id="txtLeven">levensteken –</span>
</header>
<main>
  <section class="pnl">
    <h2>ORDERS IN DE PLC</h2>
    <div class="wrap"><table>
      <thead><tr><th>ORDER</th><th>KLANT</th><th>PRODUCT</th><th>VOORTGANG</th><th>DOCK</th><th>PRIO</th><th>STATUS</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table></div>
  </section>
  <section class="pnl">
    <h2>NIEUWE ORDER</h2>
    <form id="f">
      <label>Ordernummer<input name="nr" maxlength="20" required></label>
      <label>Klant<input name="klant" maxlength="30"></label>
      <label>Product<select name="soort"><option value="1">Base blauw</option><option value="2">Lid blauw</option><option value="11">Base groen</option><option value="12">Lid groen</option></select></label>
      <label>Aantal pallets<input name="aantal" type="number" min="1" max="999" value="5" required></label>
      <label>Prioriteit<select name="prio"><option value="1">Hoog</option><option value="2" selected>Normaal</option><option value="3">Laag</option></select></label>
      <button>NAAR PLC STUREN</button>
      <div id="melding"></div>
    </form>
  </section>
</main>
<script>
const KLEUR={wachtend:'#80868C',bezig:'#2A71B8',gepauzeerd:'#B08C00',gereed:'#3B6D11',geannuleerd:'#5A6068'};
const PRIO={1:'Hoog',2:'Normaal',3:'Laag'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function status(){
  try{const s=await (await fetch('/api/status')).json();
    document.getElementById('ledPlc').style.background=s.plc_verbonden?'#3FC24A':'#D93636';
    document.getElementById('txtPlc').textContent=s.plc_verbonden?'PLC VERBONDEN':'PLC NIET BEREIKBAAR';
    document.getElementById('txtLeven').textContent='levensteken MES '+s.mes_levensteken+' · PLC '+(s.plc_levensteken??'–');
  }catch(e){document.getElementById('txtPlc').textContent='BRIDGE NIET BEREIKBAAR'}
}
async function orders(){
  const b=document.getElementById('body');
  try{const r=await (await fetch('/api/orders')).json();
    if(!r.ok){b.innerHTML='<tr><td colspan="8" class="leeg">'+esc(r.fout)+'</td></tr>';return}
    b.innerHTML=r.orders.map(o=>`<tr><td><b>${esc(o.nr)}</b></td><td>${esc(o.klant)}</td><td>${esc(o.product)}</td>
      <td><span class="bar"><i style="width:${Math.round(o.gepickt/o.aantal*100)}%"></i></span>${o.gepickt}/${o.aantal}</td>
      <td>${o.dock}</td><td>${PRIO[o.prio]||o.prio}</td><td><span class="st" style="background:${KLEUR[o.statustekst]||'#80868C'}">${o.statustekst.toUpperCase()}</span></td>
      <td>${o.status>=1&&o.status<=3?`<button class="klein" data-nr="${esc(o.nr)}">annuleren</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="leeg">Geen orders</td></tr>';
  }catch(e){b.innerHTML='<tr><td colspan="8" class="leeg">Bridge niet bereikbaar</td></tr>'}
}
document.getElementById('body').onclick=async e=>{const nr=e.target.dataset&&e.target.dataset.nr;if(!nr)return;
  const r=await (await fetch('/api/orders/'+encodeURIComponent(nr)+'/annuleren',{method:'POST'})).json();melding(r.ok?'Order '+nr+' geannuleerd':r.fout,r.ok);orders()};
function melding(t,ok){const m=document.getElementById('melding');m.textContent=t;m.style.color=ok?'var(--ok)':'var(--err)'}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  const r=await (await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();
  melding(r.ok?'Order '+r.nr+' staat in de PLC':r.fout,r.ok);if(r.ok)e.target.nr.value='';orders()};
status();orders();setInterval(status,1000);setInterval(orders,2000);
</script>
</body>
</html>
